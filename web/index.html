<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>我的日程</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">历</div>
      <div class="brand-copy"><strong>我的日程</strong><span>农历 · 节假日 · 提醒</span></div>
    </div>
    <button class="new-button" data-action="new"><span class="plus">＋</span>新建计划<small>N</small></button>
    <nav class="nav">
      <button class="nav-item" data-view="calendar"><i class="nav-icon">📅</i>计划日历</button>
      <button class="nav-item" data-view="today"><i class="nav-icon">☀️</i>今天<span id="today-count" class="nav-badge">0</span></button>
      <button class="nav-item" data-view="inbox"><i class="nav-icon">🔔</i>提醒中心<span id="reminder-count" class="nav-badge">0</span></button>
      <button class="nav-item" data-view="done"><i class="nav-icon">✓</i>已完成</button>
    </nav>
    <div id="categories" class="categories"></div>
    <div id="mini-calendar" class="mini-calendar"></div>
    <button class="settings-button" data-action="settings">⚙ 设置</button>
  </aside>
  <main class="workspace">
    <header class="page-header">
      <div><h1 id="page-title">计划日历</h1><p id="page-subtitle"></p></div>
      <div class="header-actions">
        <input id="search" type="search" placeholder="搜索计划…  按 / 聚焦" autocomplete="off">
      </div>
    </header>
    <section id="summary" class="summary"></section>
    <section id="page-body">
      <div id="calendar-page">
        <div class="toolbar">
          <div class="range-nav">
            <button id="prev" title="上一页 ←">‹</button>
            <button id="today-btn" class="pill" title="回到今天 T">今天</button>
            <button id="next" title="下一页 →">›</button>
          </div>
          <h2 id="range-label"></h2>
          <div class="segmented" id="mode-switch">
            <button data-mode="month" class="active">月</button>
            <button data-mode="four">四周</button>
            <button data-mode="week">周</button>
            <button data-mode="list">清单</button>
          </div>
        </div>
        <div class="calendar-wrap">
          <div id="calendar" class="calendar month"></div>
          <aside id="day-panel" class="day-panel"></aside>
        </div>
      </div>
      <div id="list-page" class="list-page"></div>
    </section>
  </main>
</div>

<dialog id="editor">
  <form id="task-form" method="dialog">
    <h3 id="editor-title">新建计划</h3>
    <label class="field"><span>标题</span><input name="title" maxlength="160" required placeholder="要做什么？"></label>
    <div class="field-row">
      <label class="field"><span>日期</span><input name="date" type="date" required></label>
      <label class="field"><span>时间</span><input name="time" type="time" required value="09:00"></label>
      <label class="field"><span>时长</span>
        <select name="duration">
          <option value="15">15 分钟</option><option value="30">30 分钟</option>
          <option value="45">45 分钟</option><option value="60" selected>60 分钟</option>
          <option value="90">90 分钟</option><option value="120">120 分钟</option>
          <option value="180">180 分钟</option><option value="240">240 分钟</option>
        </select></label>
    </div>
    <div class="field-row">
      <label class="field"><span>结束日期（跨天）</span><input name="endDate" type="date"></label>
      <label class="field"><span>或共几天</span><input name="spanDays" type="number" min="1" max="366" value="1"></label>
    </div>
    <p id="span-hint" class="hint"></p>
    <div class="field-row" id="repeat-field">
      <label class="field"><span>重复</span>
        <select name="repeat">
          <option value="1" selected>不重复</option>
          <option value="daily">每天（至指定日期）</option>
          <option value="weekdays">每个工作日（至指定日期）</option>
          <option value="4">每周一次，共 4 次</option>
          <option value="8">每周一次，共 8 次</option>
          <option value="12">每周一次，共 12 次</option>
        </select></label>
      <label class="field repeat-until-field" hidden><span>重复至</span><input name="repeatUntil" type="date"></label>
    </div>
    <div class="field-row">
      <label class="field"><span>分类</span>
        <select name="category"><option value="work">工作</option><option value="study">学习</option><option value="life">生活</option></select></label>
      <label class="field"><span>提醒</span>
        <select name="reminder">
          <option value="-1">不提醒</option><option value="0">开始时</option><option value="5">提前 5 分钟</option>
          <option value="10">提前 10 分钟</option><option value="15" selected>提前 15 分钟</option>
          <option value="30">提前 30 分钟</option><option value="60">提前 1 小时</option><option value="1440">提前 1 天</option>
        </select></label>
      <label class="field"><span>优先级</span>
        <select name="priority"><option value="normal">普通</option><option value="high">高</option></select></label>
    </div>
    <label class="field"><span>备注</span><textarea name="notes" maxlength="5000" rows="2" placeholder="补充说明…"></textarea></label>
    <p id="form-hint" class="hint"></p>
    <p id="form-error" class="error"></p>
    <div class="dialog-actions">
      <button type="button" class="danger" id="delete-task" hidden>删除</button>
      <span class="spacer"></span>
      <button type="button" class="close-dialog">取消</button>
      <button type="submit" class="primary" id="save-task">保存</button>
    </div>
  </form>
</dialog>

<dialog id="settings-dialog">
  <form method="dialog">
    <h3>设置</h3>
    <div class="field-row">
      <label class="field"><span>语言</span>
        <select id="set-language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
      <label class="field"><span>每周始于</span>
        <select id="set-week-start"><option value="1">周一</option><option value="0">周日</option></select></label>
    </div>
    <div class="field-row">
      <label class="check"><input type="checkbox" id="set-lunar"> 日历显示农历</label>
      <label class="check"><input type="checkbox" id="set-holidays"> 显示节假日角标</label>
    </div>
    <h4>AI 智能录入（OpenAI 兼容）</h4>
    <div class="ai-box">
      <input id="ai-input" placeholder="用一句话描述计划，如：下周三下午三点开会一小时">
      <button type="button" class="primary" id="ai-parse">AI 解析</button>
    </div>
    <p id="ai-hint" class="hint">解析结果会填入新建计划表单，确认后保存。</p>
    <div class="field-row">
      <label class="field"><span>API 地址</span><input id="set-ai-endpoint" placeholder="https://api.deepseek.com/v1"></label>
      <label class="field"><span>模型</span><input id="set-ai-model" placeholder="deepseek-chat"></label>
    </div>
    <label class="field"><span>API Key（存于系统凭据管理器）</span><input id="set-ai-key" type="password" placeholder="sk-…"></label>
    <h4>数据</h4>
    <p id="data-dir" class="hint"></p>
    <div class="dialog-actions">
      <button type="button" id="export-backup">导出备份</button>
      <button type="button" id="import-backup">导入备份</button>
      <span class="spacer"></span>
      <button type="button" class="close-dialog">关闭</button>
    </div>
    <p id="settings-error" class="error"></p>
    <div class="dialog-actions">
      <button type="button" class="primary" id="save-settings">保存设置</button>
    </div>
  </form>
</dialog>

<div id="reminder-overlay" class="reminder-overlay" hidden>
  <div class="reminder-card">
    <div class="reminder-head">🔔 计划提醒</div>
    <div id="reminder-body"></div>
    <div class="dialog-actions">
      <button class="primary" data-reminder-action="done">完成</button>
      <button data-reminder-action="snooze">稍后 10 分钟</button>
      <button class="close-reminder">知道了</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
